name: CI

on:
  pull_request:
    branches: ["main"]
  
  push:
    branches:
      - "renovate/**"

# Prevent duplicate runs if Renovate falls back to creating a PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# We are using OpenID Connect to authenticate with Azure with secret.
# https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-azure
permissions:
  id-token: write
  contents: read

jobs:
  main:
    runs-on: [idp]
    environment: ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Azure DevOps artifacts
        uses: workleap/wl-reusable-workflows/az-artifact-authenticate@main
        with:
          feed-url: ${{ vars.GSOFTDEV_NUGET_SOURCE }}
          variables: ${{ toJSON(vars) }}

      - run: ./Build.ps1
        shell: pwsh
        env:
          NUGET_SOURCE: ${{ vars.GSOFTDEV_NUGET_SOURCE }}

  test:
    name: test-${{ matrix.project }}
    runs-on: windows-latest
    environment: ci
    strategy:
      fail-fast: false
      matrix:
        project: [Net10, Net472]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6

      - name: Authenticate to Azure DevOps artifacts
        uses: workleap/wl-reusable-workflows/az-artifact-authenticate@main
        with:
          feed-url: ${{ vars.GSOFTDEV_NUGET_SOURCE }}
          variables: ${{ toJSON(vars) }}

      - name: Test ${{ matrix.project }}
        run: dotnet test -c Release --project src/Workleap.Extensions.Xunit.Tests.${{ matrix.project }}
